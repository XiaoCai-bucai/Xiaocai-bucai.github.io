<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>矿物</title>
</head>
<body>
<div id="minerals-container"></div>
</body>
</html>
<script>
    async function getItemPrice(itemId, method) {
        for (let i = 0; i < 5; i++) {
            // 至多尝试 5 次，防止死循环
            try {
                const response = await fetch(`https://esi.evetech.net/latest/markets/10000002/orders/?datasource=tranquility&order_type=${method}&type_id=${itemId}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                const data = await response.json();
                return data.map(order => order.price);
            } catch (error) {
                console.error("请求失败，正在重试:", error);
                // 每1秒重试一次
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }
        return [NaN];
    }

    function displayMaxPrice(itemId, method) {
        getItemPrice(itemId, method).then(prices => {
            const elementId = 'max-price-' + itemId;
            if (prices.length > 0 && !isNaN(prices[0])) {
                const maxPrice = Math.max(...prices);
                document.getElementById(elementId).textContent = "最高买价: " + maxPrice; // 将最大价格插入到 HTML 元素中
            } else {
                document.getElementById(elementId).textContent = "未获取到有效价格"; // 处理未获取到有效价格的情况
            }
        });
    }

    function displayMinPrice(itemId, method) {
        getItemPrice(itemId, method).then(prices => {
            const elementId = 'min-price-' + itemId;
            if (prices.length > 0 && !isNaN(prices[0])) {
                const minPrice = Math.min(...prices);
                document.getElementById(elementId).textContent = "最低卖价: " + minPrice; // 将最大价格插入到 HTML 元素中
            } else {
                document.getElementById(elementId).textContent = "未获取到有效价格"; // 处理未获取到有效价格的情况
            }
        });
    }

    async function fetchWithRetry(url, maxRetries, retryDelay) {
        for (let i = 0; i <= maxRetries; i++) {
            try {
                return await fetch(url).then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                });
            } catch (error) {
                console.error(`Error fetching data: ${error}`);
                if (i === maxRetries)
                    throw error;
            }
            await new Promise((resolve) => setTimeout(resolve, retryDelay));
        }
    }

    async function fetchhistory(type_id) {
        const url = `https://esi.evetech.net/latest/markets/10000002/history/?datasource=tranquility&type_id=${type_id}`;
        const fetchedData = await fetchWithRetry(url, 3, 1000);
        // 创建一个 Map 来存储每个日期对应的最高价总和、最低价总和和对应的成交量
        const summaryMap = new Map();
        // 假设获取的数据是一个数组，每个元素代表一个日期的历史数据
        // 这里假设获取的数据格式和您提供的示例相同，如果不同，需要相应调整代码
        fetchedData.forEach(entry => {
            const {date, highest, lowest, volume} = entry;
            if (!summaryMap.has(date)) {
                summaryMap.set(date, {highest: highest, lowest: lowest, volume: volume});
            } else {
                const prevData = summaryMap.get(date);
                summaryMap.set(date, {
                    highest: prevData.highest + highest,
                    lowest: prevData.lowest + lowest,
                    volume: Math.min(prevData.volume, volume)
                });
            }
        });
        // 将 Map 转换为您想要的格式
        return Array.from(summaryMap).map(([date, {highest, lowest, volume}]) => {
            return [date, highest, lowest, volume];
        });
    }

    // Function to format y axis ticks with units
    function formatTicks(value, index, values) {
        var units = ['', 'k', 'm', 'b', 't'];
        var unitIndex = Math.floor(Math.log10(value) / 3);
        var unitLabel = units[unitIndex];
        var tickValue = value / Math.pow(10, unitIndex * 3);
        return tickValue + unitLabel;
    }

    // Function to filter labels to display every other label
    function filterLabels(value, index, values) {
        return index % 2 === 0 ? value : '';
    }

    // Function to create charts for a given itemId and name
    function createCharts(itemId, name) {
        fetchhistory(itemId).then(data => {
            // Extract price and quantity data
            var highPrices = data.map(row => row[1]);
            var lowPrices = data.map(row => row[2]);

            // Chart configuration for price
            var priceConfig = {
                type: 'line',
                data: {
                    labels: data.map(row => row[0]),
                    datasets: [
                        {
                            label: '最高价格',
                            data: highPrices,
                            borderColor: 'rgb(75, 192, 192)',
                            borderWidth: 1,
                            fill: false,
                            pointRadius: 0
                        },
                        {
                            label: '最低价格',
                            data: lowPrices,
                            borderColor: 'rgb(255, 99, 132)',
                            borderWidth: 1,
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: false,
                    animation: {
                        duration: 0 // Disable animation
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: name
                        }
                    },
                    scales: {
                        x: {
                            display: false,
                            grid: {
                                display: false // 隐藏网格线
                            },
                            ticks: {
                                callback: filterLabels // 过滤标签
                            }
                        },
                        y: {
                            display: true,
                            title: {
                                display: true,
                                text: '价格'
                            },
                            ticks: {
                                callback: formatTicks // 自定义刻度标签
                            }
                        }
                    }
                }
            };

            // Create price chart
            var priceChart = new Chart(
                document.getElementById('priceChart-' + itemId),
                priceConfig
            );

        });
    }

    // Function to generate HTML elements for minerals
    function generateMineralElements(minerals) {
        const container = document.getElementById('minerals-container');
        minerals.forEach(mineral => {
            const {itemId, name} = mineral;

            // Create h1 element
            const h1 = document.createElement('h1');
            h1.innerHTML = `${name} - <span id="max-price-${itemId}">最高买价: </span> - <span id="min-price-${itemId}">最低卖价: </span>`;
            container.appendChild(h1);

            // Create price chart canvas
            const priceCanvas = document.createElement('canvas');
            priceCanvas.id = `priceChart-${itemId}`;
            priceCanvas.width = 800;
            priceCanvas.height = 250;
            container.appendChild(priceCanvas);

            // // Create quantity chart canvas
            // const quantityCanvas = document.createElement('canvas');
            // quantityCanvas.id = `quantityChart-${itemId}`;
            // quantityCanvas.width = 400;
            // quantityCanvas.height = 200;
            // container.appendChild(quantityCanvas);

            // Add a container for better styling
            const chartContainer = document.createElement('div');
            chartContainer.className = 'chart-container';
            chartContainer.appendChild(priceCanvas);
            // chartContainer.appendChild(quantityCanvas);
            container.appendChild(chartContainer);
        });
    }

    const minerals = [
        {itemId: 11399, name: '莫尔石'},
        {itemId: 34, name: '三钛合金'},
        {itemId: 39, name: '晶状石英核岩'},
        {itemId: 38, name: '超新星诺克石'},
        {itemId: 40, name: '超噬矿'},
        {itemId: 36, name: '类银超金属'},
        {itemId: 37, name: '同位聚合体'},
        {itemId: 35, name: '类晶体胶矿'}
    ];
    generateMineralElements(minerals);
    minerals.forEach(mineral => {
        displayMaxPrice(mineral.itemId, 'buy');
        displayMinPrice(mineral.itemId, 'sell');
        createCharts(mineral.itemId, mineral.name);
    });

</script>
